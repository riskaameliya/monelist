name: Release macOS DMG

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Build and verify universal DMG
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Use a version tag such as v1.0.0." >&2
            exit 1
          fi
          if ! command -v ffmpeg >/dev/null 2>&1; then
            brew install ffmpeg
          fi
          ARCHS="arm64 x86_64" VERSION="$version" ./build.sh
          lipo build/MoneList.app/Contents/MacOS/MoneList -verify_arch arm64 x86_64
          codesign --verify --deep --strict build/MoneList.app
          ./scripts/make-dmg.sh "$version"
          dmg="build/MoneList-$version.dmg"
          hdiutil verify "$dmg"
          printf 'DMG=%s\n' "$dmg" >> "$GITHUB_ENV"

      - name: Publish DMG
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            assets="$(gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name')"
            if ! grep -Fxq "${DMG##*/}" <<< "$assets"; then
              gh release upload "$GITHUB_REF_NAME" "$DMG"
            fi
          else
            gh release create "$GITHUB_REF_NAME" "$DMG" \
              --verify-tag --generate-notes \
              --notes "Universal macOS 13+ build. The app is signed ad-hoc and has not been notarized."
          fi
